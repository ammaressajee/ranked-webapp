<div class="app-shell">
  <header class="topbar">
    <div class="left-section">
      <button (click)="toggleSidebar()" class="menu-btn" aria-label="Toggle sidebar">
        <span class="menu-icon">{{ isSidebarOpen ? '✕' : '☰' }}</span>
      </button>
      <a routerLink="/" class="app-title">
        <span class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 2v20M18 2v20M6 6h12M6 10h12M6 14h12M6 18h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="logo-text">Ladders</span>
      </a>
    </div>
    <div class="right-section">
      <a routerLink="/messages" class="topbar-icon-btn" aria-label="Messages" *ngIf="authService.isAuthReady() && authService.isLoggedIn()">
        <span class="material-symbols-outlined">chat</span>
        <span class="topbar-badge" *ngIf="totalUnread() > 0">{{ totalUnread() > 9 ? '9+' : totalUnread() }}</span>
      </a>
      <a routerLink="/help" class="topbar-icon-btn" aria-label="Help">
        <span class="material-symbols-outlined">help</span>
      </a>
      <!-- Wait for auth to restore on reload before showing signed-out state -->
      <ng-container *ngIf="!authService.isAuthReady()">
        <span class="auth-loading" aria-hidden="true"></span>
      </ng-container>
      <ng-container *ngIf="authService.isAuthReady() && !authService.isLoggedIn()">
        <a (click)="isSidebarOpen=false" class="auth-btn login" routerLink="/login">Get Started</a>
      </ng-container>
      <ng-container *ngIf="authService.isAuthReady() && authService.isLoggedIn()">
        <button (click)="handleLogout()" class="auth-btn logout">Sign Out</button>
      </ng-container>
    </div>
  </header>

  <!-- Main layout area -->
  <div class="layout-container">
    <!-- Backdrop: only on mobile when sidebar open; blocks scroll and closes on tap -->
    <div class="sidebar-backdrop" [class.visible]="isSidebarOpen" (click)="closeSidebar()" aria-hidden="true"></div>
    <!-- Sidebar -->
    <app-sidebar class="sidebar" [class.open]="isSidebarOpen" [isSidebarOpen]="isSidebarOpen"
      [class.collapsed]="!isSidebarOpen" [messagesUnreadCount]="totalUnread()" (clickOutside)="closeSidebar()" (toggleEvent)="toggleSidebar()"></app-sidebar>

    <!-- Main content -->
    <main class="main-content" [class.sidebar-open]="isSidebarOpen">
      <router-outlet></router-outlet>
    </main>
  </div>

  <footer class="app-footer">
    @if (showFooterAd) {
      <div class="footer-ad">
        <app-ad-slot placement="footer" [adSlotId]="adSlotFooter"></app-ad-slot>
      </div>
    }
    <div class="footer-links">
      <a routerLink="/terms">Terms</a>
      <a routerLink="/privacy">Privacy</a>
      <a routerLink="/help">Help</a>
    </div>
    <span class="footer-notice">© {{ currentYear }} Ammar Essajee. All rights reserved.</span>
  </footer>
</div>
