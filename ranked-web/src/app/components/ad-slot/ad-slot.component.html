@if (showSlot) {
  <div class="ad-container" [class.ad-container--footer]="placement === 'footer'" [class.ad-container--card]="placement === 'card'">
    <span class="ad-label">Sponsored</span>
    <ins class="adsbygoogle"
         style="display:block"
         [attr.data-ad-client]="adClient"
         [attr.data-ad-slot]="adSlotId"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>
}
