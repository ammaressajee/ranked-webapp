<div class="league-detail page">
    <header class="league-header">
        <h1>🏓 {{ (league$ | async)?.name || leagueId }}</h1>
        <a [routerLink]="['/leagues', leagueId, 'join']" class="join-link">Join this league</a>
    </header>

    <section class="cta-section">
        <h2>Find a match</h2>
        <p class="cta-hint">Get paired with an opponent in your league</p>
        <p *ngIf="isInLeague() === false && !findingMatch" class="find-hint">
            <a [routerLink]="['/leagues', leagueId, 'join']">Join this league</a> first to find a match.
        </p>
        <p *ngIf="findMatchError" class="find-error">{{ findMatchError }}</p>
        <div class="buttons primary">
            <button class="btn-primary" (click)="findMatch()" [disabled]="findingMatch || isInLeague() !== true">
                {{ findingMatch ? 'Searching…' : 'Find Match' }}
            </button>
            <button class="btn-secondary" (click)="openMatches()">My Matches</button>
        </div>
    </section>

    <section class="standings-section">
        <div class="section-header">
            <h3>Standings</h3>
            <button class="btn-link" (click)="openLeaderboard()">Full leaderboard</button>
        </div>
        <ul class="standings-list">
            <li *ngFor="let p of participants$ | async; let i = index">
                <span class="pos">#{{ i + 1 }}</span>
                <span class="name">{{ p.displayName }}</span>
                <span class="rank-badge">ELO {{ p.currentRank }}</span>
            </li>
        </ul>
    </section>
</div>
