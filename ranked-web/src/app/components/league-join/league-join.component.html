<div class="league-join page">
    <h2>Join {{ (league$ | async)?.name || 'League' }}</h2>
    <p class="league-location" *ngIf="(league$ | async)?.location">📍 {{ (league$ | async)?.location }}</p>

    <div *ngIf="joinBlockedReason" class="join-blocked">
        <p>{{ joinBlockedReason }}</p>
        <a routerLink="/leagues" class="back-link">← Find leagues near you</a>
    </div>

    <div *ngIf="!joinBlockedReason" class="join-actions">
        <p class="join-hint">We need your location to confirm you're within {{ LEAGUE_RADIUS_MILES }} miles (players meet in person).</p>
        <button (click)="joinWithLocation()" class="btn-primary" [disabled]="joining">
            {{ joining ? 'Joining…' : '📍 Use my location & join' }}
        </button>
    </div>
</div>
