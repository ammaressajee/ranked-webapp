<div class="match-chat" #chatContainer>

  <!-- Collapsed: prominent open button -->
  <button *ngIf="!expanded" type="button" class="chat-open-btn" (click)="toggleChat()">
    <span class="material-symbols-outlined chat-btn-icon">chat</span>
    <span class="chat-open-label">Message {{ opponentName }}</span>
    <span class="chat-open-right">
      <span class="unread-badge" *ngIf="(unreadCount$ | async) as count">{{ count }} new</span>
      <span class="material-symbols-outlined chevron">chevron_right</span>
    </span>
  </button>

  <!-- Expanded chat -->
  <div class="chat-body" *ngIf="expanded">

    <!-- Header with minimize affordance -->
    <div class="chat-header">
      <span class="chat-header-label">
        <span class="material-symbols-outlined">chat</span>
        Messages
      </span>
      <button type="button" class="minimize-btn" (click)="toggleChat()" title="Minimize chat" aria-label="Minimize chat">
        <span class="material-symbols-outlined">expand_more</span>
      </button>
    </div>

    <!-- Error banner -->
    <div class="chat-status error" *ngIf="sendError">
      <span class="material-symbols-outlined">error</span>
      {{ sendError }}
    </div>

    <!-- Message list -->
    <div class="message-list" #messageList>
      <ng-container *ngIf="messages$ | async as messages">
        <div *ngIf="messages.length === 0" class="empty-chat">
          <p>No messages yet. Say hi to {{ opponentName }}!</p>
        </div>
        <div
          *ngFor="let msg of messages; trackBy: trackByMsg"
          class="message-row"
          [class.mine]="isMe(msg.senderUid)"
          [class.theirs]="!isMe(msg.senderUid) && msg.type !== 'system'"
          [class.system]="msg.type === 'system'"
        >
          <div class="bubble">{{ msg.text }}</div>
        </div>
      </ng-container>
    </div>

    <!-- Quick action chips -->
    <div class="quick-actions">
      <button
        *ngFor="let action of quickActions"
        type="button"
        class="chip"
        [class.sent]="sentActions.has(action)"
        (click)="sendQuickAction(action)"
        [disabled]="sending || sentActions.has(action)"
      >
        <span class="material-symbols-outlined chip-check" *ngIf="sentActions.has(action)">check</span>
        {{ action }}
      </button>
    </div>

    <!-- Input row -->
    <div class="chat-input-row">
      <input
        type="text"
        class="chat-input"
        [(ngModel)]="newMessage"
        (keydown)="onKeydown($event)"
        (focus)="onInputFocus()"
        placeholder="Type a message…"
        [disabled]="sending"
        maxlength="500"
      />
      <button type="button" class="send-btn" (click)="send()" [disabled]="sending || !newMessage.trim()">
        {{ sending ? 'Sending…' : 'Send' }}
      </button>
    </div>
  </div>
</div>
